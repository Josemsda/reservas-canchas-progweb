services:
  postgres:
    image: postgres:16
    container_name: reservas-canchas-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservas_canchas
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: